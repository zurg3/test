<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Gist Markdown Viewer</title>
    <script src="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/js/lib.min.js"></script>
  </head>
  <body>
    <div id="output"></div>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.min.js"></script>
    <script>
      const current_url = new URL(window.location);
      const params = Object.fromEntries(current_url.searchParams.entries());

      const output = document.getElementById('output');

      async function get_data() {
        const gist_id = params.id || prompt('Gist ID');

        if (gist_id) {
          const gist = await lib.parse_data(`https://api.github.com/gists/${gist_id}`, 'json');
          const files = gist.files;
          const content = Object.values(files).filter(file => file.language === 'Markdown').map(file => file.content);

          lib.append_html(output, marked.parse(content.join('\n')));
        }
      }

      get_data();
    </script>
  </body>
</html>
